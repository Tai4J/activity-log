name: CI/CD Deployment Pipeline

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x] # 【O級任務】卓越自動化：加入多版本矩陣測試
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build
        run: |
          npm install
          npm run build --if-present
          zip -r build.zip .

      - name: Upload Artifact
        if: matrix.node-version == '22.x' # 避免重複上傳
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip

  test-unit:
    needs: build
    runs-on: ubuntu-latest
    env:
      TEST_ENV: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install

      - name: Run Unit Tests
        run: |
          echo "Running unit tests..."
          npm run test:unit || (echo "❌ Unit tests failed" && exit 1)

  test-integration:
    needs: test-unit
    runs-on: ubuntu-latest
    env:
      TEST_ENV: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Run Integration Tests
        run: |
          echo "Running integration tests..."
          npm run test:integration || (echo "❌ Integration tests failed" && exit 1)

  deploy-dev:
    needs: test-integration
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Dev Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # 【O級任務】卓越自動化：動態參數化版號
          TAG: ${{ vars.BUILD_TAG }}.${{ github.run_number }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          gh release create "$TAG" build.zip --notes "$NOTE"

  deploy-staging:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Staging Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}.${{ github.run_number }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          gh release create "$TAG" build.zip --notes "$NOTE"

  ai-pre-deploy-review:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: staging    # scoped secret access for this job
    permissions:
      contents: read # 【O級護欄】給予 AI 代理最低唯讀權限
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 10 # 抓取最近的 commits 讓 AI 讀取

      - name: Generate AI Release Notes
        env:
          # 【O級護欄】從機密庫讀取 API Key，絕不 Hard-code
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          COMMITS=$(git log -5 --pretty=format:"- %s")
          JSON_TEXT=$(jq -n --arg text "你是一個資深工程師。請根據以下 Git 變更紀錄，用繁體中文總結一份簡潔的「Release Notes 與上線風險評估」，讓審核者在批准上線到 Production 前能快速參考：\n$COMMITS" '$text')
          
          PAYLOAD="{\"contents\":[{\"parts\":[{\"text\": $JSON_TEXT }]}]}"
          
          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
          -H 'Content-Type: application/json' \
          -d "$PAYLOAD" > ai_response.json
          
          AI_TEXT=$(cat ai_response.json | jq -r '.candidates[0].content.parts[0].text // "AI 讀取失敗，請人工確認。"')
          
          # 【O級護欄】保存 AI 產出至 Summary，確保人類能審核它
          echo "### 🤖 AI 部署前風險評估報告" >> $GITHUB_STEP_SUMMARY
          echo "$AI_TEXT" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    needs: [deploy-staging, ai-pre-deploy-review]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Production Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}.${{ github.run_number }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          gh release create "$TAG" build.zip --notes "$NOTE"
